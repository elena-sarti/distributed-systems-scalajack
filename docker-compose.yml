x-backend: &backend
  image: scalajack-backend
  pull_policy: never   # the image is built locally, never downloaded


services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scalajack}
      POSTGRES_USER: ${POSTGRES_USER:-scalajack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  lobby:
    <<: *backend
    build: . # the only service that builds the image
    environment:
      NODE_ROLE: lobby
    ports:
      - "9080:8080"
    depends_on: # only the lobby depends on the db
      db:
        condition: service_healthy

  table-1:
    <<: *backend
    environment:
      NODE_ROLE: table
    ports:
      - "9081:8080"

volumes:
  db-data: