x-backend: &backend
  image: scalajack-backend
  pull_policy: never
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
    interval: 5s
    timeout: 3s
    start_period: 60s
    retries: 6

x-node-environment: &node-environment
  DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-scalajack}?connectTimeout=5&socketTimeout=10
  DB_USER: ${POSTGRES_USER:-scalajack}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-scalajack-local-password}
  # default only for local runs: a real deployment must sets its own "SESSION_SECRET" in the .env file
  SESSION_SECRET: ${SESSION_SECRET:-scalajack-local-development-secret-not-for-production}

x-table-environment: &table-environment
  <<: *node-environment
  NODE_ROLE: table
  LOBBY_URL: http://lobby:8080
  # Localhost for a local run, set "PUBLIC_HOST" in .env to the IP of the machine running Docker so
  # that clients on other computers can reach the tables.
  TABLE_HOST: ${PUBLIC_HOST:-localhost}
  HEARTBEAT_PERIOD_SECONDS: ${HEARTBEAT_PERIOD_SECONDS:-2}
  HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-6}

x-backup-environment: &backup-environment
  <<: *node-environment
  NODE_ROLE: backup
  LOBBY_URL: http://lobby:8080
  HEARTBEAT_PERIOD_SECONDS: ${HEARTBEAT_PERIOD_SECONDS:-2}
  HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-6}
  TABLE_HOST: ${PUBLIC_HOST:-localhost}
  RETURN_WINDOW_SECONDS: ${RETURN_WINDOW_SECONDS:-30}

x-backup-depends: &backup-depends
  db:
    condition: service_healthy

x-table-depends: &table-depends
  db:
    condition: service_healthy
  lobby:
    condition: service_healthy

# The lobby starts more tables when all are full, but "docker compose up" starts only
# "table-1", "table-2" and "table-3" belong to the profile "pool", they must
# exist, for the lobby to start them (use this command to do so)
#   docker compose --profile pool up --no-start

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scalajack}
      POSTGRES_USER: ${POSTGRES_USER:-scalajack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scalajack-local-password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  lobby:
    <<: *backend
    build: .
    restart: unless-stopped
    environment:
      <<: *node-environment
      NODE_ROLE: lobby
      # table marked unavailable after this many seconds without a heartbeat (6s = 3 missed beats)
      HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-6}
      TABLE_POOL: table-1,table-2,table-3
    ports:
      - "9080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy

  table-1:
    <<: *backend
    container_name: table-1
    environment:
      <<: *table-environment
      TABLE_ID: table-1
      TABLE_PUBLIC_WS_PORT: "9091"
      BACKUP_URL: http://table-1-backup:8080
    ports:
      - "9081:8080"
      - "9091:8090"
    depends_on:
      <<: *table-depends
      table-1-backup: # without its backup the table cannot accept any move
        condition: service_started

  # The copy of table-1: it keeps the last state of the table and takes no players.
  table-1-backup:
    <<: *backend
    container_name: table-1-backup
    environment:
      <<: *backup-environment
      TABLE_ID: table-1
      TABLE_PUBLIC_WS_PORT: "9191"
    ports:
      - "9181:8080"
      - "9191:8090"
    depends_on: *backup-depends

  table-2:
    <<: *backend
    container_name: table-2
    profiles: ["pool"]
    environment:
      <<: *table-environment
      TABLE_ID: table-2
      TABLE_PUBLIC_WS_PORT: "9092"
      BACKUP_URL: http://table-2-backup:8080
    ports:
      - "9082:8080"
      - "9092:8090"
    depends_on:
      <<: *table-depends
      table-2-backup:
        condition: service_started

  table-2-backup:
    <<: *backend
    container_name: table-2-backup
    profiles: ["pool"]
    environment:
      <<: *backup-environment
      TABLE_ID: table-2
      TABLE_PUBLIC_WS_PORT: "9192"
    ports:
      - "9182:8080"
      - "9192:8090"
    depends_on: *backup-depends

  table-3:
    <<: *backend
    container_name: table-3
    profiles: ["pool"]
    environment:
      <<: *table-environment
      TABLE_ID: table-3
      TABLE_PUBLIC_WS_PORT: "9093"
      BACKUP_URL: http://table-3-backup:8080
    ports:
      - "9083:8080"
      - "9093:8090"
    depends_on:
      <<: *table-depends
      table-3-backup:
        condition: service_started

  table-3-backup:
    <<: *backend
    container_name: table-3-backup
    profiles: ["pool"]
    environment:
      <<: *backup-environment
      TABLE_ID: table-3
      TABLE_PUBLIC_WS_PORT: "9193"
    ports:
      - "9183:8080"
      - "9193:8090"
    depends_on: *backup-depends

volumes:
  db-data:
