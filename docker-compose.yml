x-backend: &backend
  image: scalajack-backend
  pull_policy: never   # the image is built locally, never downloaded

# Signs the session tokens: the lobby and every table must have the same one, so it is written once here.
# The default is only for local runs: a real deployment sets its own SESSION_SECRET in .env.
x-session-secret: &session-secret ${SESSION_SECRET:-scalajack-local-development-secret-not-for-production}


services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scalajack}
      POSTGRES_USER: ${POSTGRES_USER:-scalajack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  lobby:
    <<: *backend
    build: . # the only service that builds the image
    environment:
      NODE_ROLE: lobby
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-scalajack}   # "db" is the name of the service: Compose resolves it
      DB_USER: ${POSTGRES_USER:-scalajack}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SESSION_SECRET: *session-secret
    ports:
      - "9080:8080"
    depends_on: # only the lobby depends on the db
      db:
        condition: service_healthy

  table-1:
    <<: *backend
    environment:
      NODE_ROLE: table
      SESSION_SECRET: *session-secret
    ports:
      - "9081:8080"   # health (HTTP)
      - "9091:8090"   # WebSocket

volumes:
  db-data: